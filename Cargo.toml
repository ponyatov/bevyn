[package]
name        =  "bevyn"
version     =  "0.0.1"
description =  "Rust Game Engine workout"
authors     = ["Dmitry Ponyatov <dponyatov@gmail.com>"]
license     =  "MIT"
repository  =  "https://github.com/ponyatov/bevyn"
edition     =  "2024"

[dependencies]
const_format = "0.2"
bevy = {version="0.16", default-features = false}

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 1
# opt-level = 3
